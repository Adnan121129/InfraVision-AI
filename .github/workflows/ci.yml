name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django + pipeline)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infravision_test
          POSTGRES_USER: infravision
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infravision" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml-worker/requirements.txt
      - run: pip install -r backend/requirements-dev.txt -r ml-worker/requirements.txt
      - name: Migrations are up to date
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: python manage.py makemigrations --check --dry-run
      - name: Deploy checks
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-deploy-check-key-that-is-long-enough-to-pass-django-checks
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests (PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://infravision:ci-only-password@localhost:5432/infravision_test
        run: python -m pytest

  ml:
    name: ML worker (OpenCV + PyTorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-worker/requirements*.txt
      - run: |
          pip install -r ml-worker/requirements.txt pytest
          pip install --index-url https://download.pytorch.org/whl/cpu -r ml-worker/requirements-pytorch.txt
      - working-directory: ml-worker
        run: python -m pytest

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
